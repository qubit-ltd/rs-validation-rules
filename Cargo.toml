[package]
name = "qubit-validation-rules"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[features]
default = []
registry = ["qubit-validator/registry"]
inventory = ["registry", "qubit-validator/inventory"]
formats = []
chrono = ["dep:chrono"]
decimal = ["dep:bigdecimal"]
china-identity = []

[dependencies]
qubit-validator = { path = "../rs-validator", version = "=0.1.0", default-features = false }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
bigdecimal = { version = "0.4", optional = true }
